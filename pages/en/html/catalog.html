<script>
document.addEventListener('DOMContentLoaded', function() {
    var langSwitch = document.getElementById('lang-switch-cn');
    var path = window.location.pathname;
    // Match only English pages in /docs/
    var match = path.match(/^\/docs\/(.+)\.shtml$/);
    if (match) {
        var page = match[1];
        langSwitch.href = "/docs_cn/" + page + "_cn.shtml";
    } else {
        langSwitch.href = "/docs_cn/index_cn.shtml";
    }
});
</script>
